<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1930" role="img" aria-label="Red-Sandwich Harness — full mechanism">
<style>
.bg{fill:#fff}.lane{fill:#f6f7f9}.laneR{fill:#f3f8f5}.laneG{fill:#fdf3f3}
.t{fill:#1d2128;font-family:'Pretendard','Malgun Gothic','Segoe UI',sans-serif;text-anchor:middle}
.b{font-size:14.5px;font-weight:700}.s{font-size:12.5px;fill:#4f5866}.lh{font-size:15px;font-weight:800}
.ph{font-size:13px;font-weight:800;fill:#e8612c;text-anchor:end}.sep{stroke:#e8612c;stroke-width:1.2;stroke-dasharray:3 5;opacity:.6}
.n{stroke-width:2.2;rx:12}.bread{fill:#fff7ec;stroke:#d9953f}.fill{fill:#f0fbf5;stroke:#2fa36b}.red{fill:#fff1f1;stroke:#e5484d}
.hum{fill:#f1f4ff;stroke:#5b7cfa}.note{fill:#fffdf3;stroke:#b9a23a;stroke-dasharray:5 4}
.ar{stroke:#7a8494;stroke-width:2;fill:none}.pass{stroke:#2fa36b}.fail{stroke:#e5484d}
.el{font-size:11.5px;font-weight:700;fill:#5f6876}.ok{fill:#2fa36b}.ng{fill:#e5484d}
.band{fill:#eef0f4;stroke:#d5d9e0}
.fl{fill:none;stroke:#ff9d3c;stroke-width:3.4;stroke-linecap:round;stroke-dasharray:12 88;stroke-dashoffset:12;opacity:0;animation:fl 12.8s linear infinite;filter:drop-shadow(0 0 5px #ff9d3c)}
.fl.pass{stroke:#3fe08f;filter:drop-shadow(0 0 5px #3fe08f)}.fl.fail{stroke:#ff5d5d;filter:drop-shadow(0 0 5px #ff5d5d)}
@keyframes fl{0%{stroke-dashoffset:12;opacity:1}11%{stroke-dashoffset:-88;opacity:1}12%,100%{stroke-dashoffset:-88;opacity:0}}
@media (prefers-reduced-motion: reduce){.fl{animation:none}}
@media (prefers-color-scheme: dark){.bg{fill:#12161d}.lane{fill:#171c24}.laneR{fill:#15201b}.laneG{fill:#221719}
.t{fill:#e7eaf0}.s,.el{fill:#a6aebb}.bread{fill:#2b2216}.fill{fill:#14271d}.red{fill:#2c1517}.hum{fill:#18203a}
.note{fill:#26230f}.ar{stroke:#8d97a8}.band{fill:#1c222c;stroke:#323a47}}
</style>
